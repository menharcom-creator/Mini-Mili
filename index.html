<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <title>Mini Militia - Survival</title>
    <link href="css/reset.css" rel="stylesheet" type="text/css"/>
    <link href="css/style.css" rel="stylesheet" type="text/css"/>
</head>
<body>
    <div class="wrapper">
        <canvas id = "canvas" width="4000" height="640"></canvas>
        <div id = "messageBox" class = "message noselect">
            <h3 id="messageHeading">SURVIVAL</h3>
            <div><span>SCORE: </span><span id = "score"></span></div>
            <div><span>KILLS: </span><span id = "kills"></span></div>

            <div id = "respawn"><span>RESPAWNING: </span><span id="respawn-value"></span></div>

            <button id = "retryButton" class = "retryButton" onclick="location.reload();">Retry</button>
        </div>
    </div>
    <div id="rotateHint">Please rotate your phone to landscape</div>

    <script>
        // scale the 1360x645 game to fit any screen
        function fitGame() {
            var w = document.querySelector('.wrapper');
            var s = Math.min(window.innerWidth / 1360, window.innerHeight / 645, 1);
            w.style.transform = 'scale(' + s + ')';
            w.style.top = Math.max(0, (window.innerHeight - 645 * s) / 2) + 'px';
        }
        window.addEventListener('resize', fitGame);
        window.addEventListener('orientationchange', fitGame);
        fitGame();
    </script>

    <script src="js/Resources.js" type="text/javascript"></script>
    <script src="js/Preload.js" type="text/javascript"></script>
    <script src="js/CollisionHandler.js" type="text/javascript"></script>
    <script src="js/Constants.js" type="text/javascript"></script>
    <script src="js/Camera.js" type="text/javascript"></script>
    <script src="js/Bullet.js" type="text/javascript"></script>
    <script src="js/weapon.js" type="text/javascript"></script>
    <script src="js/TileGround.js" type="text/javascript"></script>
    <script src="js/RobotUnit.js" type="text/javascript"></script>
    <script src="js/Util.js" type="text/javascript"></script>
    <script src="js/Actor.js" type="text/javascript"></script>
    <script src="js/Shyame.js" type="text/javascript"></script>
    <script src="js/Touch.js" type="text/javascript"></script>
    <script src="js/Game.js" type="text/javascript"></script>
</body>
</html>
